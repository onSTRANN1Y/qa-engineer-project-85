- summary: |
    Успешный вход с верными email и паролем
  requirement: |
    Пользователь должен иметь возможность войти в систему с использованием верных логина/email и пароля.
  prerequisites:
    Открыта странциа входа - https://codebattle.hexlet.io/session/new?locale=en&next=%2F
  test-data: |
    Password = password123 Email = Email@gmail.com
  steps:
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Вход в аккаунт произведен. Открыта главаная страница сайта

- summary: |
    Проверка на возможность входа с некорректным email
  requirement: |
    При вводе неверного пароля или несуществующего логина/email система должна блокировать вход и выводить понятное сообщение об ошибке.
  prerequisites:
    Открыта странциа входа - https://codebattle.hexlet.io/session/new?locale=en&next=%2F
  test-data: |
    Password = password123 Email = error@gmail.com
  steps:
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Вход в аккаунт не произведен. Появилось уведомлен ошибки


- summary: |
    Проверка на возможность входа с некорректным паролем
  requirement: |
    При вводе неверного пароля или несуществующего логина/email система должна блокировать вход и выводить понятное сообщение об ошибке.
  prerequisites:
    Открыта странциа входа - https://codebattle.hexlet.io/session/new?locale=en&next=%2F
  test-data: |
    Password = error Email = Email@gmail.com
  steps:
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Вход в аккаунт не произведен. Появилось уведомлен 'Invalid email or password'

- summary: |
    Успешный вход с помощью GitHub
  requirement: |
    Пользователь должен иметь возможность войти в систему через сторонний OAuth-сервис (GitHub).
  prerequisites:
    Открыта странциа входа - https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Имеется аккаунт GitHub
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Sign in with GitHub'
    - Войти в аккаунт GitHub
    - Подтвердить согласие на обработку данных
  expected-result: |
    Произошло перенаправление обратно на наш сайт. Произведен успешный вход

- summary: |
    Проверка на возможность выхода из аккаунта
  requirement: |
    Авторизованный пользователь должен иметь возможность выйти из своей учетной записи (Logout).
  prerequisites:
    Произведен вход в аккаунт
    Открыта главная странциа - https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать на свой ник сверху экрана
    - Нажать кнопку 'Выйти'
  expected-result: |
    Произведен успешный Logout

- summary: |
    Корректное отображение профиля
  requirement: |
    В профиле пользователя должны отображаться его имя/аватар, ELO-рейтинг, статистика побед и поражений, выбранный язык програмирования, а также история сыгранных матчей.
  prerequisites:
    Произведен вход в аккаунт
    Открыта главная странциа - https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать на свой ник сверху экрана
    - Проверить отображение имя/аватар, ELO-рейтинг, статистика побед и поражений, выбранный язык програмирования
    - Нажать на вкладу 'Завершенные игры'
    - Проверить отображения истории сыгранных матчей
  expected-result: |
    Информация в профиле соответствует текущему аккаунту. Отображаются имя, аватар, числовые значения ELO и статистики. В разделе завершенных игр присутствуют карточки/список ранее сыгранных матчей с указанием результата и соперника.

- summary: |
    Корректная форма создания игры
  requirement: |
    Форма создания игры должна позволять выбырать уровень сложности, и тип комнаты (публичная или приватная), время игры и задачу для игры.
  prerequisites:
    Произведен вход в аккаунт
    Открыта главная странциа - https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Создать битву'
    - Проверить возможность выбрать уровень сложности игры
    - Проверить возможность выбрать тип игры
    - Проверить возможность выбрать время игры
    - Проверить возможность выбрать задачу по названию или тегам
  expected-result: |
    Форма создания игры соответсвует требованиям, весь функционал для настройки игры присутствует.

- summary: |
    Успешный поиск доступных для присоединения матчей с ботом
  requirement: |
    В лобби должен быть доступен функционал поиска доступных матчей или запуска игры с ботом / случайным соперником.
  prerequisites:
    Произведен вход в аккаунт
    Открыта главная странциа - https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника бота 'Codebot'
    - Нажать кнопку 'Сражаться'
  expected-result: |
    Матч успешно стартовал


- summary: |
    Успешный поиск доступных для присоединения матчей с игроками
  requirement: |
    В лобби должен быть доступен функционал поиска доступных матчей или запуска игры с ботом / случайным соперником.
  prerequisites:
    Произведен вход в аккаунт
    Открыта главная странциа - https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника игрока, с ником отличным от 'Codebot'
    - Нажать кнопку 'Сражаться'
  expected-result: |
    Матч успешно стартовал

- summary: |
    Отображение игровой комнаты
  requirement: |
    В игровой комнате должны отображаться текст задачи, таймер обратного отсчета, встроенный редактор кода с подсветкой синтаксиса и чата.
  prerequisites:
    Пользователь авторизован в системе.
    Открыта главная страница — https://codebattle.hexlet.io.
    В лобби присутствует активная игра с реальным соперником (не ботом).
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника игрока (ник отличный от 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Проверить наличие и читаемость текста условий задачи
    - Проверить отображение и работу таймера обратного отсчета
    - Проверить наличие встроенного редактора кода
    - Проверить наличие блока чата и поля ввода сообщений
  expected-result: |
    Все элементы игровой комнаты отображаются корректно, без искажений разметки

- summary: |
    Проверка корректных выводов редактора кода
  requirement: |
    При нажатии кнопки проверки («Запустить») система должна выполнять код и выводить статус прохождения тестов (количество успешных/упавших тестов).
  prerequisites:
    Пользователь авторизован в системе.
    Открыта главная страница — https://codebattle.hexlet.io.
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника бока (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Нажать кнопку запустить
  expected-result: |
    Консоль должнра отображать количество успешных/упавших тестов, результат проверки(Тесты пройдены/Тесты не пройден)

- summary: |
    Проверка корректных выводов редактора кода
  requirement: |
    При ошибке выполнения или несоответствии вывода система должна отображать разницу между ожидаемым (Expected) и фактическим (Actual) результатом.
  prerequisites:
    Пользователь авторизован в системе.
    Открыта главная страница — https://codebattle.hexlet.io.
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника бока (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Нажать кнопку запустить
  expected-result: |
    Консоль должнра отображать количество успешных/пройденых тестов из общего числа и выводить количество пройденых в процентах
