    - Ввести в редактор код решения и нажать кнопку запуска проверки
    - В таблице запросов посмотреть значения в колонке Scheme
  expected-result: |
    В колонке Scheme у всех запросов указано https. У запроса websocket указано wss (это защищённый websocket, ошибкой не считается). Значения http нет ни у одного запроса.

- summary: |
    Одинаковая работа основных сценариев в разных браузерах
  requirement: |
    Сайт должен корректно и одинаково отображаться и работать в последних версиях основных браузеров (Chrome, Firefox, Safari, Yandex Browser / Edge).
  prerequisites: |
    Установлены последние версии браузеров Chrome, Firefox, Safari, Yandex Browser (или Edge)
    Есть зарегистрированный аккаунт с подтверждённой почтой
  test-data: |
    Браузеры = Chrome, Firefox, Safari, Yandex Browser / Edge (выполнить для каждого)
    Email = Email@gmail.com
    Password = password123
  steps:
    - Открыть https://codebattle.hexlet.io в браузере из test-data
    - Выполнить вход с данными из test-data
    - Нажать кнопку 'Присоединиться к битве', выбрать соперника-бота (ник 'Codebot') и нажать 'Сражаться'
    - Ввести текст в редактор кода, нажать Tab и Ctrl+Z
    - Нажать кнопку 'Запустить'
    - Открыть свой профиль
  expected-result: |
    Во всех браузерах страницы отображаются одинаково, без сдвигов вёрстки и обрезанных элементов.
    Вход, вход в игру, работа редактора, запуск тестов и профиль работают одинаково, без ошибок.

- summary: |
    Маскирование пароля на странице регистрации
  requirement: |
    Поля ввода пароля при регистрации и входе должны маскировать символы (отображать точки или звёздочки вместо открытого текста).
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Password = password123
  steps:
    - Ввести в поле Password значение из test-data
    - Проверить отображение введённых символов
  expected-result: |
    Вместо введённых символов в поле отображаются точки или звёздочки, пароль открытым текстом не виден.

- summary: |
    Маскирование пароля на странице входа
  requirement: |
    Поля ввода пароля при регистрации и входе должны маскировать символы (отображать точки или звёздочки вместо открытого текста).
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
  test-data: |
    Password = password123
  steps:
    - Ввести в поле Password значение из test-data
    - Проверить отображение введённых символов
  expected-result: |
    Вместо введённых символов в поле отображаются точки или звёздочки, пароль открытым текстом не виден.

- summary: |
    Отправка формы входа с пустыми полями
  requirement: |
    Нажатие кнопки отправки формы при пустых обязательных полях не должно отправлять запрос и должно подсвечивать незаполненные поля ошибки.
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Открыт DevTools на вкладке Network
  test-data: |
    Email = <пусто>
    Password = <пусто>
  steps:
    - Оставить поля Email и Password пустыми
    - Нажать кнопку «Submit»
    - Проверить вкладку Network и состояние полей формы
  expected-result: |
    Запрос на сервер не отправляется (новых запросов в Network нет).
    Незаполненные поля подсвечены как ошибочные, рядом с ними отображается сообщение об ошибке.

- summary: |
    Отправка формы регистрации с пустыми полями
  requirement: |
    Нажатие кнопки отправки формы при пустых обязательных полях не должно отправлять запрос и должно подсвечивать незаполненные поля ошибки.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
    Открыт DevTools на вкладке Network
  test-data: |
    Nickname = <пусто>
    Password = <пусто>
    Email = <пусто>
  steps:
    - Оставить поля Nickname, Password и Email пустыми
    - Нажать кнопку «Submit»
    - Проверить вкладку Network и состояние полей формы
  expected-result: |
    Запрос на сервер не отправляется (новых запросов в Network нет).
    Незаполненные поля подсвечены как ошибочные, рядом с ними отображается сообщение об ошибке.

- summary: |
    Прерывание кода с бесконечным циклом по таймауту
  requirement: |
    Код с бесконечным циклом при отправке на проверку не должен приводить к зависанию браузера и должен прерываться по таймауту с сообщением об ошибке.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта игровая комната с ботом 'Codebot'
  test-data: |
    JavaScript:
    while (true) {}
    Python:
    while True:
        pass
    (взять вариант под выбранный в редакторе язык)
  steps:
    - Очистить редактор и ввести код из test-data
    - Нажать кнопку 'Запустить'
    - Во время выполнения проверить отклик страницы (прокрутка, ввод в чат, переключение вкладок браузера)
    - Дождаться окончания проверки
  expected-result: |
    Браузер и вкладка не зависают, страница откликается на действия.
    Выполнение кода прерывается по таймауту, в консоли отображается сообщение об ошибке (превышено время выполнения).
    После этого кнопка 'Запустить' снова доступна.

- summary: |
    Сохранение кода и уведомление о переподключении при разрыве сети
  requirement: |
    При кратковременном разрыве сетевого соединения (5–10 секунд) набранный в редакторе код должен сохраняться, а страница — уведомлять пользователя о попытке переподключения.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта игровая комната с ботом 'Codebot'
    Открыт DevTools на вкладке Network
  test-data: |
    Код для ввода = const a = 1;
    Длительность разрыва = 5 секунд и 10 секунд (выполнить для каждого значения)
  steps:
    - Ввести в редактор код из test-data
    - В DevTools переключить режим сети на 'Offline'
    - Выдержать паузу согласно test-data и проверить страницу
    - Вернуть режим сети на 'No throttling'
    - Подождать 10 секунд и проверить страницу и редактор
  expected-result: |
    Во время разрыва страница уведомляет пользователя о потере соединения и попытке переподключения.
    Введённый код в редакторе остаётся без изменений.
    После восстановления сети соединение восстанавливается, уведомление исчезает, игра продолжается, код сохранён.

- summary: |
    Скрытие кода и действий соперника до завершения матча
  requirement: |
    До момента официального завершения матча исходный код и действия соперника должны оставаться скрытыми.
  prerequisites: |
    Есть два аккаунта, авторизованных в разных браузерах (или в обычном окне и в режиме инкогнито)
    Игроки A и B находятся в одной игровой комнате, матч идёт
  test-data: |
    Код игрока A = const secret = 12345;
  steps:
    - В окне игрока A ввести в редактор код из test-data
    - В окне игрока A нажать кнопку 'Запустить'
    - В окне игрока B проверить область соперника и чат
    - В окне игрока B проверить, что виден результат запуска игрока A
  expected-result: |
    В окне игрока B код игрока A не отображается, процесс набора и результаты запусков соперника не видны.
    Код становится доступен только после официального завершения матча.

- summary: |
    Отсутствие кода соперника в сетевом трафике до завершения матча
  requirement: |
    До момента официального завершения матча исходный код и действия соперника должны оставаться скрытыми.
  prerequisites: |
    Есть два аккаунта, авторизованных в разных браузерах (или в обычном окне и в режиме инкогнито)
    Игроки A и B находятся в одной игровой комнате, матч идёт
    В окне игрока B открыт DevTools на вкладке Network, фильтр WS
  test-data: |
    Код игрока A = const secret = 12345;
  steps:
    - В окне игрока A ввести в редактор код из test-data
    - В окне игрока A нажать кнопку 'Запустить'
    - В окне игрока B открыть WebSocket-соединение игры и просмотреть список сообщений (Messages)
    - Выполнить поиск строки secret по сообщениям
  expected-result: |
    В WebSocket-сообщениях, полученных игроком B, нет исходного кода игрока A (строка secret не найдена).

- summary: |
    Пересчёт ELO-рейтинга обоих игроков после завершения матча
  requirement: |
    После завершения игры значения ELO-рейтинга в профилях обоих участников должны пересчитываться и соответствовать итогам матча.
  prerequisites: |
    Есть два аккаунта, авторизованных в разных браузерах (или в обычном окне и в режиме инкогнито)
    Игроки A и B находятся в одной игровой комнате на известной задаче
    Для игроков записаны значения ELO и статистика побед и поражений до матча
  test-data: |
    ELO игрока A до матча = записать
    ELO игрока B до матча = записать
    Верное решение задачи = известно игроку A
  steps:
    - Игроку A ввести верное решение и нажать кнопку 'Запустить'
    - Дождаться официального завершения матча
    - Открыть профиль игрока A и зафиксировать ELO и статистику
    - Открыть профиль игрока B и зафиксировать ELO и статистику
  expected-result: |
    Игра завершена, победителем указан игрок A.
    ELO игрока A увеличился, ELO игрока B уменьшился, изменения соответствуют формуле расчёта рейтинга.
    Победа засчитана игроку A, поражение игроку B, матч есть в 'Завершенные игры' обоих профилей.

- summary: |
    Визуальный отклик кликабельных элементов на наведение и клик
  requirement: |
    Все кликабельные элементы (кнопки, переключатели языков, ссылки) должны визуально реагировать на наведение курсора и клик.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    Элементы для проверки:
    кнопка 'Присоединиться к битве'
    кнопка 'Создать битву'
    переключатель языка интерфейса (RU / EN)
    ссылки в шапке и подвале
    кнопки в игровой комнате ('Запустить', переключатель языка программирования)
    кнопка «Submit» на страницах входа и регистрации
  steps:
    - Навести курсор на каждый элемент из test-data и проверить изменение вида (цвет, подсветка, курсор-«рука»)
    - Нажать на каждый элемент и удерживать кнопку мыши, проверить визуальное состояние нажатия
    - Отпустить кнопку мыши и проверить результат действия
  expected-result: |
    Каждый элемент заметно меняет внешний вид при наведении (цвет, подсветка, подчёркивание или курсор-«рука»).
    В момент клика элемент выглядит нажатым или получает фокус. После клика выполняется соответствующее действие.
