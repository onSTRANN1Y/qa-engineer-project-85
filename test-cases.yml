---
- summary: |
    Регистрация с корректными логином, email и паролем
  requirement: |
    Пользователь должен иметь возможность зарегистрировать новый аккаунт, указав логин, email и пароль.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
    Пользователь с указанными ником и email не зарегистрирован (данные должны быть уникальными при каждом прогоне)
  test-data: |
    Nickname = ilona
    Password = password123
    Email = Email@gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Открыта страница входа, отображается сообщение о необходимости подтвердить почту.

- summary: |
    Невозможность регистрации с уже существующим email
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
    Пользователь с email Email@gmail.com уже зарегистрирован
    Ник ilona_new в системе не занят
  test-data: |
    Nickname = ilona_new
    Password = password123
    Email = Email@gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация не выполнена. Отображается сообщение о том, что email уже занят. Пользователь остаётся на странице регистрации.

- summary: |
    Невозможность регистрации с уже существующим логином
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
    Открыт DevTools на вкладке Network
    Пользователь с ником onSTRANN1Y уже зарегистрирован
    Email new_email@gmail.com в системе не занят
  test-data: |
    Nickname = onSTRANN1Y
    Password = password123
    Email = new_email@gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация не выполнена. Отображается сообщение о том, что ник уже занят.
    В DevTools (Network) сервер возвращает статус 422.

- summary: |
    Невозможность регистрации с некорректным форматом email
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = ilona_email
    Password = password123
    Email = email.gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация не выполнена. Отображается сообщение об ошибке формата email.

- summary: |
    Невозможность регистрации со слишком коротким паролем
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = ilona_pass
    Password = 123
    Email = short_pass@gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация не выполнена. Отображается сообщение о недопустимой длине пароля.

- summary: |
    Невозможность регистрации с пустыми полями
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = <пусто>
    Password = <пусто>
    Email = <пусто>
  steps:
    - Оставить поля Nickname, Password и Email пустыми
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация не выполнена. Рядом с обязательными полями отображаются сообщения об ошибке.

- summary: |
    Отклонение логина со спецсимволами (XSS-payload)
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = <svg/onload=a()>
    Password = password123
    Email = xss_test@gmail.com
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация отклонена с ошибкой: «Must consist of Latin letters, numbers and underscores. Only begin with latin letter».
    Скрипт не выполняется, аккаунт не создан.

- summary: |
    Отклонение логина с SQL-инъекцией
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites: |
    Открыта страница регистрации — https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = admin' --
    Password = password123
    Email = sqli_test@gmail.com
    (после «--» в нике стоит пробел)
  steps:
    - Ввести в поле Nickname значение из test-data
    - Ввести в поле Password значение из test-data
    - Ввести в поле Email значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Регистрация отклонена с сообщением об ошибке валидации логина. Аккаунт не создан, SQL-инъекция не сработала.

- summary: |
    Успешный вход с верными email и паролем
  requirement: |
    Пользователь должен иметь возможность войти в систему с использованием верных логина/email и пароля.
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Существует зарегистрированный аккаунт с подтверждённой почтой
  test-data: |
    Email = Email@gmail.com
    Password = password123
  steps:
    - Ввести в поле Email значение из test-data
    - Ввести в поле Password значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Вход выполнен. Открыта главная страница, в шапке отображается ник пользователя.

- summary: |
    Невозможность входа с несуществующим email
  requirement: |
    При вводе неверного пароля или несуществующего логина/email система должна блокировать вход и выводить понятное сообщение об ошибке.
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Пользователь с email error@gmail.com не зарегистрирован
  test-data: |
    Email = error@gmail.com
    Password = password123
  steps:
    - Ввести в поле Email значение из test-data
    - Ввести в поле Password значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Вход не выполнен. Отображается уведомление об ошибке (указать фактический текст, например 'Invalid email or password').

- summary: |
    Невозможность входа с неверным паролем
  requirement: |
    При вводе неверного пароля или несуществующего логина/email система должна блокировать вход и выводить понятное сообщение об ошибке.
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Существует зарегистрированный аккаунт с email Email@gmail.com
  test-data: |
    Email = Email@gmail.com
    Password = error
  steps:
    - Ввести в поле Email значение из test-data
    - Ввести в поле Password значение из test-data
    - Нажать кнопку «Submit»
  expected-result: |
    Вход не выполнен. Отображается уведомление 'Invalid email or password'.

- summary: |
    Успешный вход через GitHub
  requirement: |
    Пользователь должен иметь возможность войти в систему через сторонний OAuth-сервис (GitHub).
  prerequisites: |
    Открыта страница входа — https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Имеется аккаунт GitHub
    Сервис GitHub доступен
  test-data: |
    Учётные данные собственного аккаунта GitHub
  steps:
    - Нажать кнопку 'Sign in with GitHub'
    - Войти в аккаунт GitHub
    - Подтвердить согласие на обработку данных
  expected-result: |
    Выполнено перенаправление обратно на сайт Codebattle. Вход выполнен, в шапке отображается ник пользователя.

- summary: |
    Выход из аккаунта
  requirement: |
    Авторизованный пользователь должен иметь возможность выйти из своей учетной записи (Logout).
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать на свой ник вверху экрана
    - Нажать кнопку 'Выйти'
  expected-result: |
    Выход выполнен. Ник пользователя в шапке не отображается, вместо него доступна кнопка входа.

- summary: |
    Корректное отображение профиля
  requirement: |
    В профиле пользователя должны отображаться его имя/аватар, ELO-рейтинг, статистика побед и поражений, выбранный язык программирования, а также история сыгранных матчей.
  prerequisites: |
    Пользователь авторизован в системе
    У пользователя есть хотя бы одна завершённая игра
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать на свой ник вверху экрана
    - Проверить отображение имени и аватара
    - Проверить отображение ELO-рейтинга
    - Проверить отображение статистики побед и поражений
    - Проверить отображение выбранного языка программирования
    - Перейти на вкладку 'Завершенные игры'
    - Проверить отображение истории сыгранных матчей
  expected-result: |
    Информация в профиле соответствует текущему аккаунту. Отображаются имя, аватар, числовые значения ELO и статистики.
    В разделе завершённых игр есть список ранее сыгранных матчей с указанием результата и соперника.

- summary: |
    Отображение элементов формы создания игры
  requirement: |
    Форма создания игры должна позволять выбирать уровень сложности, тип комнаты (публичная или приватная), время игры и задачу для игры.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Создать битву'
    - Выбрать уровень сложности и убедиться, что значение применилось
    - Выбрать тип комнаты (публичная или приватная) и убедиться, что значение применилось
    - Выбрать время игры и убедиться, что значение применилось
    - Выбрать задачу по названию или тегам и убедиться, что значение применилось
  expected-result: |
    В форме доступны все настройки: уровень сложности, тип комнаты, время игры и выбор задачи. Выбранные значения отображаются в форме.

- summary: |
    Присоединение к игре с ботом
  requirement: |
    В лобби должен быть доступен функционал поиска доступных матчей или запуска игры с ботом / случайным соперником.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-бота (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
  expected-result: |
    Открыта игровая комната с задачей и таймером, соперником указан 'Codebot'.

- summary: |
    Присоединение к игре с реальным игроком
  requirement: |
    В лобби должен быть доступен функционал поиска доступных матчей или запуска игры с ботом / случайным соперником.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
    В лобби есть созданная игра реального игрока (например, вторым аккаунтом)
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-игрока (ник отличный от 'Codebot')
    - Нажать кнопку 'Сражаться'
  expected-result: |
    Открыта игровая комната с задачей и таймером, соперником указан выбранный игрок.

- summary: |
    Отображение игровой комнаты
  requirement: |
    В игровой комнате должны отображаться текст задачи, таймер обратного отсчета, встроенный редактор кода с подсветкой синтаксиса и чат.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
    В лобби есть созданная игра реального игрока (например, вторым аккаунтом)
  test-data: |
    <Empty>
  steps:
    - Выполнить вход в игру с реальным игроком (шаги кейса «Присоединение к игре с реальным игроком»)
    - Проверить наличие и читаемость текста условия задачи
    - Проверить отображение таймера обратного отсчёта и убедиться, что время уменьшается
    - Проверить наличие встроенного редактора кода с подсветкой синтаксиса
    - Проверить наличие блока чата и поля ввода сообщений
  expected-result: |
    Все элементы игровой комнаты отображаются корректно, без искажений разметки: условие задачи, работающий таймер, редактор кода с подсветкой синтаксиса, чат с полем ввода.

- summary: |
    Вывод статуса тестов в консоли редактора кода
  requirement: |
    При нажатии кнопки проверки («Запустить») система должна выполнять код и выводить статус прохождения тестов (количество успешных/упавших тестов).
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
    (код в редакторе остаётся по умолчанию)
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-бота (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Нажать кнопку 'Запустить'
  expected-result: |
    Консоль отображает количество успешных и упавших тестов и итог проверки ('Тесты не пройдены' для кода по умолчанию).

- summary: |
    Отображение Expected и Actual при неверном решении
  requirement: |
    При ошибке выполнения или несоответствии вывода система должна отображать разницу между ожидаемым (Expected) и фактическим (Actual) результатом.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    Код с заведомо неверным результатом (например, функция возвращает неверное значение)
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-бота (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Ввести в редактор код из test-data
    - Нажать кнопку 'Запустить'
  expected-result: |
    Консоль отображает ошибку. Для проваленного теста показаны значения Expected (ожидаемое) и Actual (фактическое), они различаются.

- summary: |
    Проверка возможности сдаться
  requirement: |
    Пользователь должен иметь возможность сдаться (Surrender/Give Up) во время матча.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    <Empty>
  steps:
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-бота (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Нажать троеточие над терминалом
    - Выбрать 'Сдаться'
    - Подвердить нажатием 'Сдаться'
  expected-result: |
    Пользователь успешно сдался, игра завершена.

- summary: |
    Адаптивность страниц авторизации и главной при ширине 320 px
  requirement: |
    Интерфейс сайта должен быть адаптирован для мобильных устройств (от 320px до 768px): элементы не должны выходить за пределы экрана, горизонтальная полоса прокрутки должна отсутствовать.
  prerequisites: |
    Открыт браузер Chrome с DevTools (режим Toggle device toolbar)
    Пользователь авторизован в системе (для главной страницы)
  test-data: |
    Ширина экрана = 320 px
    Страницы:
    https://codebattle.hexlet.io
    https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    https://codebattle.hexlet.io/users/new?next=/
  steps:
    - В DevTools включить режим эмуляции устройства и задать ширину 320 px (Responsive)
    - Открыть каждую страницу из test-data
    - Прокрутить каждую страницу вниз до конца
    - Попытаться прокрутить страницу вправо
  expected-result: |
    На каждой странице все элементы (кнопки, поля, текст, меню) полностью помещаются в экран и не обрезаются.
    Горизонтальная полоса прокрутки отсутствует.

- summary: |
    Адаптивность страниц авторизации и главной при ширине 768 px
  requirement: |
    Интерфейс сайта должен быть адаптирован для мобильных устройств (от 320px до 768px): элементы не должны выходить за пределы экрана, горизонтальная полоса прокрутки должна отсутствовать.
  prerequisites: |
    Открыт браузер Chrome с DevTools (режим Toggle device toolbar)
    Пользователь авторизован в системе (для главной страницы)
  test-data: |
    Ширина экрана = 768 px
    Страницы:
    https://codebattle.hexlet.io
    https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    https://codebattle.hexlet.io/users/new?next=/
  steps:
    - В DevTools включить режим эмуляции устройства и задать ширину 768 px (Responsive)
    - Открыть каждую страницу из test-data
    - Прокрутить каждую страницу вниз до конца
    - Попытаться прокрутить страницу вправо
  expected-result: |
    На каждой странице все элементы полностью помещаются в экран и не обрезаются.
    Горизонтальная полоса прокрутки отсутствует.

- summary: |
    Адаптивность игровой комнаты на мобильных экранах
  requirement: |
    Интерфейс сайта должен быть адаптирован для мобильных устройств (от 320px до 768px): элементы не должны выходить за пределы экрана, горизонтальная полоса прокрутки должна отсутствовать.
  prerequisites: |
    Открыт браузер Chrome с DevTools (режим Toggle device toolbar)
    Пользователь авторизован в системе
    Открыта главная страница — https://codebattle.hexlet.io
  test-data: |
    Ширина экрана = 320 px и 768 px (выполнить для каждого значения)
  steps:
    - В DevTools включить режим эмуляции устройства и задать ширину из test-data
    - Нажать кнопку 'Присоединиться к битве'
    - В списке доступных игр выбрать соперника-бота (ник 'Codebot')
    - Нажать кнопку 'Сражаться'
    - Проверить расположение текста задачи, таймера, редактора кода и чата
    - Прокрутить страницу вниз и вправо
  expected-result: |
    Текст задачи, таймер, редактор кода и чат полностью помещаются в экран, не перекрывают друг друга.
    Горизонтальная полоса прокрутки отсутствует. Редактором и кнопкой 'Запустить' можно пользоваться.

- summary: |
    Время первой загрузки страниц не превышает 3 секунд
  requirement: |
    Время первой загрузки страниц сайта при стандартном подключении (Wi-Fi/4G) не должно превышать 3 секунд.
  prerequisites: |
    Открыт браузер Chrome с DevTools на вкладке Network
    Включена опция 'Disable cache'
    Выбран профиль throttling 'Fast 4G' (или тест выполняется по Wi-Fi без ограничений)
  test-data: |
    Страницы:
    https://codebattle.hexlet.io
    https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    https://codebattle.hexlet.io/users/new?next=/
    Число замеров на страницу = 3
  steps:
    - Открыть страницу из test-data
    - Выполнить жёсткую перезагрузку (Ctrl+Shift+R)
    - Зафиксировать значение Load в нижней строке вкладки Network
    - Повторить замер ещё два раза
    - Повторить шаги для остальных страниц из test-data
  expected-result: |
    Для каждой страницы время загрузки (Load) не превышает 3 секунд. Результат считается по среднему из трёх замеров.

- summary: |
    Синхронизация таймера игры между двумя игроками
  requirement: |
    Синхронизация состояния игры (таймер, готовность игроков) должна происходить в реальном времени с минимальной задержкой отклика.
  prerequisites: |
    Есть два аккаунта, авторизованных в разных браузерах (или в обычном окне и в режиме инкогнито)
    Первый игрок создал игру через 'Создать битву', второй присоединился
  test-data: |
    Игрок A — аккаунт 1
    Игрок B — аккаунт 2
    Допустимая разница таймеров = не более 1 секунды (порог уточнить в требованиях)
  steps:
    - Расположить окна игроков A и B рядом на одном экране
    - Начать игру
    - Сравнить значения таймера в обоих окнах в течение 30 секунд
  expected-result: |
    Таймеры в обоих окнах идут синхронно, разница показаний не превышает допустимую. Таймер не замирает и не перескакивает.

- summary: |
    Синхронизация готовности игроков в реальном времени
  requirement: |
    Синхронизация состояния игры (таймер, готовность игроков) должна происходить в реальном времени с минимальной задержкой отклика.
  prerequisites: |
    Есть два аккаунта, авторизованных в разных браузерах (или в обычном окне и в режиме инкогнито)
    Первый игрок создал игру через 'Создать битву', открыта комната ожидания
  test-data: |
    Игрок A — аккаунт 1 (создатель игры)
    Игрок B — аккаунт 2 (присоединяется)
    Допустимая задержка обновления = не более 1 секунды (порог уточнить в требованиях)
  steps:
    - Расположить окна игроков A и B рядом на одном экране
    - В окне игрока B нажать кнопку 'Присоединиться к битве' и выбрать игру игрока A
    - Нажать кнопку 'Сражаться'
    - Проверить в окне игрока A отображение игрока B в комнате
  expected-result: |
    В окне игрока A игрок B появляется в комнате без перезагрузки страницы и в пределах допустимой задержки.
    Статус обоих игроков одинаков в обоих окнах.

- summary: |
    Отклик редактора кода на ввод символов
  requirement: |
    Редактор кода должен плавно откликаться на ввод символов и горячие клавиши (Ctrl+Z, Tab) без визуальных задержек и фризов.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта игровая комната с ботом 'Codebot'
  test-data: |
    Текст для ввода — не менее 50 строк кода (вставить из буфера обмена), затем набор с клавиатуры 100 символов подряд
  steps:
    - Вставить в редактор текст из test-data
    - Набрать с клавиатуры 100 символов подряд в быстром темпе
    - Прокрутить редактор вверх и вниз
  expected-result: |
    Символы появляются сразу при нажатии клавиш, без заметной задержки. Редактор не фризится, прокрутка плавная.

- summary: |
    Отклик редактора кода на горячие клавиши Ctrl+Z и Tab
  requirement: |
    Редактор кода должен плавно откликаться на ввод символов и горячие клавиши (Ctrl+Z, Tab) без визуальных задержек и фризов.
  prerequisites: |
    Пользователь авторизован в системе
    Открыта игровая комната с ботом 'Codebot'
  test-data: |
    Строка для ввода = const a = 1;
  steps:
    - Установить курсор в редактор
    - Ввести строку из test-data
    - Нажать Tab в начале строки
    - Нажать Ctrl+Z
    - Нажать Ctrl+Z ещё раз
  expected-result: |
    Tab добавляет отступ без потери фокуса редактора (курсор остаётся в редакторе, фокус не уходит на другой элемент страницы).
    Каждое нажатие Ctrl+Z мгновенно отменяет последнее изменение. Визуальных задержек и фризов нет.

- summary: |
    Автоматическое перенаправление с HTTP на HTTPS
  requirement: |
    Передача данных на сайте должна осуществляться исключительно по защищенному протоколу HTTPS.
  prerequisites: |
    Открыт браузер с чистой историей или в режиме инкогнито
  test-data: |
    http://codebattle.hexlet.io
  steps:
    - Ввести в адресную строку URL из test-data
    - Нажать Enter
    - Проверить протокол в адресной строке и индикатор защищённого соединения
  expected-result: |
    Выполнено перенаправление на https://codebattle.hexlet.io. В адресной строке отображается значок защищённого соединения.
    Предупреждений о небезопасном соединении нет.

- summary: |
    При входе на сайт все запросы идут по HTTPS
  requirement: |
    Данные на сайте передаются только по HTTPS.
  prerequisites: |
    Браузер Chrome
    Пользователь не авторизован на сайте
    Есть тестовый аккаунт
  test-data: |
    Страница: https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    Логин: <test_user>
    Пароль: <test_password>
  steps:
    - Нажать F12, чтобы открыть инструменты разработчика, и перейти на вкладку «Сеть»
    - Поставить галочки «Сохранить журнал» и «Отключить кеш»
    - Нажать правой кнопкой мыши на заголовок таблицы (Название, Статус, Тип...) и выбрать Scheme
    - Открыть страницу входа из test-data
    - Ввести логин и пароль и нажать кнопку входа
    - В таблице запросов посмотреть значения в колонке Scheme
  expected-result: |
    В колонке Scheme у всех запросов указано https. У запроса websocket указано wss (это защищённый websocket, ошибкой не считается). Значения http нет ни у одного запроса.

