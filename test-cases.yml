---
- summary: |
    Проверка регистрации пользователя с корректными логином и паролем
  requirement: |
    Пользователь должен иметь возможность зарегистрировать новый аккаунт, указав логин, email и пароль.
  prerequisites: |
    Открыта странциа регистрации - https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = ilona Password = password123 Email = Email@gmail.com
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Пользователь должен попасть на страницу входа и увидеть сообщение о необходимости подтверждения почты

- summary: |
    Невозможность регистрации с уже существующим в системе Email
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites:
    Открыта странциа регистрации - https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = ilona Password = password123 Email = Email@gmail.com
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Пользователь должен получить сообщение об ошибке

- summary: |
    Невозможность регистрации с уже существующим в системе логином
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites:
    Открыта странциа регистрации - https://codebattle.hexlet.io/users/new?next=/
    Открыт DevTools на вкладе NetWork
  test-data: |
    Nickname = onSTRANN1Y Password = password123 Email = Email@gmail.com
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Пользователь должен получить сообщение об ошибке
    В DevTools сервер возвращает статус 422

- summary: |
    Проверка защиты от Stored XSS в поле Логин
  requirement: |
    Система должна блокировать регистрацию при вводе некорректного формата email, некорректного/слишком короткого пароля или если указанный email/логин уже занят.
  prerequisites:
    Открыта странциа регистрации - https://codebattle.hexlet.io/users/new?next=/
  test-data: |
    Nickname = <svg/onload=a()>
    Password = password123
    Email = Email@gmail.com
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим email
    - Нажимаем кнопку «Submit»
  expected-result: |
    Система отклоняет регистрацию с ошибкой: «Must consist of Latin letters, numbers and underscores. Only begin with latin letter»

